name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install fastapi httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Lint with flake8
        run: |
          pip install flake8
          # 语法错误与未定义名称直接失败，其余仅告警
          flake8 kugame/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 kugame/ --count --exit-zero --max-line-length=120 --statistics

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic-settings httpx pyyaml rich

      - name: Verify backend imports and question bank API
        working-directory: web/backend
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from main import app
          client = TestClient(app)
          stats = client.get('/api/questions/stats').json()
          assert stats['total_questions'] >= 300, stats
          assert client.get('/health').json()['status'] == 'healthy'
          print('backend ok, questions:', stats['total_questions'])
          "
